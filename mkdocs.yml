site_name: Cloud Storage API
site_description: "Documentation for the shared cloud storage contract."

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - content.code.copy

nav:
  - 'Overview': 'index.md'
  - 'Architecture': 'component.md'
  - 'API Reference':
    - 'Cloud Storage API': 'api/cloud_storage_api.md'
  - 'Testing': 'testing.md'
  - 'CI Setup': 'circleci-setup.md'

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

plugins:
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src/cloud_storage_api/src
          options:
            show_source: false
            docstring_section_style: spacy
            members_order: source
